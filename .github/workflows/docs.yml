name: Documentation

on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "README.md", "specs/**", "pyproject.toml"]
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md", "specs/**", "pyproject.toml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run mkdocs build --strict
