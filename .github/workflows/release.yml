name: Release artifact

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/build_web.py --output dist/finassert-web.html
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

# Publishing is deliberately absent. Add a protected GitHub environment and
# PyPI trusted publisher only after maintainers approve the release process.
