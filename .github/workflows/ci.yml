name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit authors
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_author.py --history "$REVISION"
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run pytest
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/finassert
      - run: uv build
      - name: Verify the built distributions install and run
        run: uv run python scripts/verify_dist.py dist
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Build browser app
        run: uv run python scripts/build_web.py --output dist/web/finassert.html
      - name: Publish browser app for reviewers
        uses: actions/upload-artifact@v4
        with:
          name: finassert-web
          path: dist/web/finassert.html
          if-no-files-found: error
      - name: Build Excel add-in
        run: uv run python scripts/build_excel.py --output-dir dist/excel
      - name: Publish Excel add-in files for reviewers
        uses: actions/upload-artifact@v4
        with:
          name: finassert-excel
          path: dist/excel/*
          if-no-files-found: error
      - name: Check the add-in manifest with Microsoft's validator
        # The validator calls a Microsoft web service, so a failure here may be the
        # service rather than the manifest: informational until it has proved reliable.
        continue-on-error: true
        run: npx --yes office-addin-manifest validate dist/excel/manifest.xml
      - name: Build the offline Excel add-in (Pyodide bundled)
        run: >-
          uv run python scripts/build_excel.py --output-dir dist/excel-offline
          --bundle-pyodide download
      - name: Publish the offline Excel add-in for reviewers
        uses: actions/upload-artifact@v4
        with:
          name: finassert-excel-offline
          path: dist/excel-offline
          if-no-files-found: error
      - name: Install Chromium
        run: uv run --with playwright==1.55.0 playwright install --with-deps chromium
      - name: Smoke-test browser app against the Pyodide CDN
        run: uv run --with playwright==1.55.0 python scripts/smoke_web.py dist/web/finassert.html
      - name: Smoke-test the Excel task pane against a stand-in for Excel
        run: uv run --with playwright==1.55.0 python scripts/smoke_excel.py dist/excel/taskpane.html
      - name: Smoke-test the offline Excel add-in with no CDN
        run: >-
          uv run --with playwright==1.55.0 python scripts/smoke_excel.py
          dist/excel-offline/taskpane.html --serve
