name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include proprietary datasets, credentials, or personal financial data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what financial behavior did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and include the exact rule configuration.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: finassert version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, operating system, and optional integration versions.
