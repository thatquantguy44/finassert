<button id="excel-write" type="button" hidden>Write results to a sheet</button>
<p id="excel-result-state" class="hint"></p>
<section id="excel-findings" aria-labelledby="excel-findings-title" hidden>
  <h3 id="excel-findings-title">Diagnostic findings</h3>
  <p class="hint">Only retained diagnostic examples are shown. Navigation rechecks the captured source and selects a cell or the source columns of a row.</p>
  <p id="excel-navigation-state" role="status" aria-live="polite"></p>
  <div id="excel-findings-list"></div>
</section>
