[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "finassert"
version = "0.1.0"
description = "Financial invariants, tested like code."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "finassert contributors" }]
keywords = ["finance", "validation", "data-quality", "quantitative-finance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.1"]
yaml = ["PyYAML>=6.0"]

[dependency-groups]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mkdocs-material>=9.5",
  "mypy>=1.11",
  "pandas>=2.1",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/thatquantguy44/finassert"
Issues = "https://github.com/thatquantguy44/finassert/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/finassert"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/specs", "/examples", "/README.md", "/LICENSE", "/pyproject.toml", "/mkdocs.yml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"examples/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/finassert"]

[tool.uv]
default-groups = ["dev"]
